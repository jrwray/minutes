name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Minutes targets Windows (Recycle Bin, Start.bat, case-insensitive paths).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest
