[project]
name = "minutes"
version = "0.1.0"
description = "Local meeting recording -> transcript, speakers and summary"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3,<4",
    "torch>=2.4,<2.9",
    "torchaudio>=2.4,<2.9",
    "huggingface_hub>=0.24,<1.0",
    "numpy<2.3",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "av>=11,<16",  # faster-whisper 1.2 passes metadata_errors, removed in PyAV 16
]

[project.optional-dependencies]
# NVIDIA GPU transcription: cuBLAS for CTranslate2 (cuDNN ships inside its wheel).
# Install with: uv sync --extra gpu
gpu = ["nvidia-cublas-cu12>=12.4,<13"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::SyntaxWarning"]
